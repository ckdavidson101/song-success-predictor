[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
exclude = ["venv",".venv"]

[tool.ruff.lint]
select = ["E","F","I","UP","B"]
ignore = ["E203","E266","E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
strict_optional = true
